[package]
name = "elevation"
version = "0.2.1"
authors = ["OpenAPI Generator team and contributors"]
description = "The elevation service is a location service which returns TopoBathy elevation values that combine topography (land elevation) and bathymetry (water depths)."
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dev-dependencies]
tokio = { version = ">=1.4", features = ["full"] }

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.12", features = ["json", "multipart"] }
